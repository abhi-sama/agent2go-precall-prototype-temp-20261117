services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: a2g-db-pg
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: agent2go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent2go"]
      interval: 2s
      timeout: 2s
      retries: 30
