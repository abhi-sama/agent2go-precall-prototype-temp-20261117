[project]
name = "a2g-infra"
version = "0.1.0"
description = "Local agent2go stack on floci: provisioning for the FE and BE emulated accounts"
requires-python = ">=3.12"
dependencies = [
  "a2g-logging",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
]

[project.scripts]
a2g-provision = "a2g_infra.provision:main"

[tool.uv.sources]
a2g-logging = { path = "../libs/a2g_logging", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2g_infra"]
