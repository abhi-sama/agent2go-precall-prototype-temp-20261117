[project]
name = "a2g-api-lambda"
version = "0.1.0"
description = "BE account API Lambda: AppSync field resolvers over RLS-scoped Postgres"
requires-python = ">=3.12"
dependencies = [
  "a2g-exec-analysis",
  "a2g-logging",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "boto3>=1.43.123",
    "pytest>=8",
]

[tool.uv.sources]
a2g-exec-analysis = { path = "../../libs/a2g_exec_analysis", editable = true }
a2g-logging = { path = "../../libs/a2g_logging", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2g_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
