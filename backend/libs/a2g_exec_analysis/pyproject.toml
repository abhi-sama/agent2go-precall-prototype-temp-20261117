[project]
name = "a2g-exec-analysis"
version = "0.1.0"
description = "Executive aggregate-only theme analysis with small-group disclosure, shared by the API Lambda and the agent"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2g_exec_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
