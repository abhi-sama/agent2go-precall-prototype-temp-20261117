# Shared GraphQL contract (foundation-contract.md). Used verbatim by the Amplify
# Gen2 backend (real AWS) and by the local floci provisioner.
# The default auth mode is the Cognito user pool, so no per-type auth directives.
type LandingKpis {
  distinctCalls: Int!
  distinctEngagedHcps: Int!
  responseCount: Int!
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
}

type Me {
  userId: ID!
  fullName: String!
  email: String!
  persona: String!
  scopeLabel: String!
}

"""
One territory on the real-world map. Only territories in the caller's effective scope are
returned: out-of-scope territory metadata is itself access-controlled, so it is never named or
coloured. `distinctCalls` is null (and `suppressed` true) when an aggregate-only caller would
otherwise see a small group.
"""
type GeoTerritory {
  territoryId: ID!
  name: String!
  regionId: String!
  regionName: String!
  "ISO 3166-1 alpha-2."
  countryCode: String!
  countryName: String!
  "USPS code for the United States, the local code elsewhere (the call feed's st_cd)."
  subdivisionCode: String!
  subdivisionName: String!
  latitude: Float!
  longitude: Float!
  isOwn: Boolean!
  distinctCalls: Int
  suppressed: Boolean!
}

"Distinct calls across a country's in-scope territories (not a sum of per-territory counts)."
type GeoCountry {
  countryCode: ID!
  countryName: String!
  territoryCount: Int!
  distinctCalls: Int
  suppressed: Boolean!
}

"Counts for the territory map, with the window they cover."
type GeoActivity {
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
  territories: [GeoTerritory!]!
  countries: [GeoCountry!]!
}

"""
One calendar month of the caller's activity. Counts only: no target, rank or score.
distinctEngagedHcps is distinct within the month, so months do not add up to the window total.
isPartial marks a month that data-through has not yet covered in full.
"""
type ActivityMonth {
  month: AWSDate!
  distinctCalls: Int!
  distinctEngagedHcps: Int!
  isPartial: Boolean!
  channels: [ChannelCount!]!
}

"Distinct calls recorded under one channel. A call under several channels counts once in each."
type ChannelCount {
  channel: String!
  distinctCalls: Int!
}

type ActivityTrends {
  from: AWSDate!
  to: AWSDate!
  months: [ActivityMonth!]!
  channels: [String!]!
  totalDistinctCalls: Int!
  totalDistinctEngagedHcps: Int!
  dataThrough: AWSDateTime
  scopeLabel: String!
}

enum ActivityMetric {
  CALLS
  HCPS
}

"""
A record behind a chart point. interactionDate is when the exchange happened; loadedAt is
when the record reached this system. They are different things and both are shown.
"""
type EvidenceRecord {
  recordId: ID!
  kind: String!
  hcpId: String
  hcpName: String
  territoryId: String
  channel: String
  callCount: Int!
  interactionDate: AWSDate!
  loadedAt: AWSDateTime
}

type ActivityEvidence {
  metric: ActivityMetric!
  month: AWSDate!
  channel: String
  total: Int!
  truncated: Boolean!
  latestInteractionDate: AWSDate
  latestLoadedAt: AWSDateTime
  dataThrough: AWSDateTime
  scopeLabel: String!
  records: [EvidenceRecord!]!
}

enum CoverageStatus {
  AVAILABLE
  NO_TARGET_POPULATION
}

"""
Coverage is engaged target HCPs over the approved target population. When no approved target
population exists the status is NO_TARGET_POPULATION and every number is null: it is withheld,
never estimated.
"""
type TerritoryCoverage {
  status: CoverageStatus!
  targetHcps: Int
  engagedTargetHcps: Int
  percentage: Float
}

type ScopeCoverage {
  status: CoverageStatus!
  targetHcps: Int
  engagedTargetHcps: Int
  percentage: Float
  territoriesWithTargets: Int!
  territoriesInScope: Int!
  asOf: AWSDate!
}

type OverviewDefinition {
  key: String!
  label: String!
  text: String!
}

"A deterministic statement about the data, never generated. Counts only."
type Disclosure {
  code: String!
  message: String!
}

"""
Team-level headline counts. distinctCalls and callProductRows are different numbers on purpose:
the source repeats a call once per product discussed. reportingCompleteness is null when there is
nobody to measure.
"""
type DirectorKpis {
  distinctCalls: Int!
  distinctEngagedHcps: Int!
  callProductRows: Int!
  responseCount: Int!
  reportingMembers: Int!
  territoriesInScope: Int!
  territoriesWithActivity: Int!
  unattributedCalls: Int!
  reportingCompleteness: Float
}

type TeamMonth {
  month: AWSDate!
  isPartial: Boolean!
  distinctCalls: Int!
  distinctEngagedHcps: Int!
}

type MonthCount {
  month: AWSDate!
  distinctCalls: Int!
}

"One territory under one window and one set of definitions. Used by the overview table and by comparisons."
type TerritoryRow {
  territoryId: ID!
  name: String!
  regionId: String!
  regionName: String!
  distinctCalls: Int!
  distinctEngagedHcps: Int!
  callProductRows: Int!
  responseCount: Int!
  reportingMembers: Int!
  rosteredMembers: Int!
  callsPerReportingMember: Float
  reportingCompleteness: Float
  latestLoadDate: AWSDate
  coverage: TerritoryCoverage!
}

type TeamMember {
  memberId: ID!
  name: String!
  linkedToRoster: Boolean!
  territoryIds: [String!]!
  distinctCalls: Int!
  activeMonths: Int!
  expectedMonths: Int!
  reportingCompleteness: Float!
  months: [MonthCount!]!
}

enum MixDimensionKind {
  CHANNEL
  TOPIC
  DISEASE_STATE
  PRODUCT
}

type MixValue {
  value: String!
  distinctCalls: Int!
  callProductRows: Int!
  months: [MonthCount!]!
}

"""
Distinct calls per value. valueTotal is the sum over all values, which exceeds totalDistinctCalls
when a call is recorded under several values; the two are never merged.
"""
type MixDimension {
  dimension: MixDimensionKind!
  label: String!
  totalDistinctCalls: Int!
  valueTotal: Int!
  valuesOverlap: Boolean!
  values: [MixValue!]!
}

type DirectorOverview {
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
  definitionVersion: String!
  definitions: [OverviewDefinition!]!
  kpis: DirectorKpis!
  months: [TeamMonth!]!
  territories: [TerritoryRow!]!
  members: [TeamMember!]!
  mix: [MixDimension!]!
  coverage: ScopeCoverage!
  notes: [Disclosure!]!
}

"Territories side by side over one identical window and one set of definitions."
type TerritoryComparison {
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
  definitionVersion: String!
  definitions: [OverviewDefinition!]!
  territories: [TerritoryRow!]!
  populationsUnequal: Boolean!
  disclosures: [Disclosure!]!
}

"""
A count that may be withheld. `value` is null exactly when `suppressed` is true: the group is too small to
show, or showing it would let a withheld group be worked out by subtraction.
"""
type SuppressedCount {
  value: Int
  suppressed: Boolean!
}

enum ExecutiveAccessLevel {
  AGGREGATE_ONLY
  RECORD_DRILLDOWN
}

enum ExecutiveRankBy {
  CALLS
  RESPONSES
  ENGAGED_HCPS
  CALLS_PER_TERRITORY
  COMPLETENESS
}

enum ExecutiveUnitLevel {
  REGION
  TERRITORY
}

enum ExecutiveFreshnessStatus {
  CURRENT
  PARTIAL
  NO_DATA
}

enum ExecutiveDrilldownKind {
  CALLS
  RESPONSES
}

type DisclosureRule {
  minCell: Int!
  text: String!
  suppressedCells: Int!
  "False when the viewer holds record-level permission, so nothing is withheld."
  applied: Boolean!
}

type ExecutiveKpis {
  calls: SuppressedCount!
  responses: SuppressedCount!
  engagedHcps: SuppressedCount!
  regionsInScope: Int!
  territoriesInScope: Int!
  "Percent of territory-months with at least one recorded call."
  reportingCompleteness: Float
}

type ExecutiveFreshness {
  status: ExecutiveFreshnessStatus!
  callsLoadedThrough: AWSDateTime
  responsesLoadedThrough: AWSDateTime
  sourceLagDays: Int
  monthsShown: Int!
}

type ExecutiveMonth {
  month: AWSDate!
  isPartial: Boolean!
  calls: SuppressedCount!
  responses: SuppressedCount!
  engagedHcps: SuppressedCount!
  territoriesReporting: Int!
  territoriesInScope: Int!
  reportingCompleteness: Float!
}

type ExecutiveUnit {
  "Null for a unit whose ranking value is withheld."
  rank: Int
  id: ID!
  name: String!
  level: ExecutiveUnitLevel!
  regionId: ID!
  regionName: String!
  territoriesInScope: Int!
  calls: SuppressedCount!
  responses: SuppressedCount!
  engagedHcps: SuppressedCount!
  callsPerTerritory: Float
  reportingCompleteness: Float
}

type ExecutiveDepthBand {
  band: String!
  hcps: SuppressedCount!
}

type ExecutiveChannel {
  channel: String!
  calls: SuppressedCount!
}

type ExecutiveCoverage {
  status: String!
  percentage: Float
  territoriesWithTargets: Int!
  territoriesInScope: Int!
}

type ExecutiveEngagement {
  engagedHcps: SuppressedCount!
  callsPerEngagedHcp: Float
  depth: [ExecutiveDepthBand!]!
  channels: [ExecutiveChannel!]!
  coverage: ExecutiveCoverage!
}

"Aggregate-only enterprise view over the viewer's explicitly authorized regions."
type ExecutiveOverview {
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
  accessLevel: ExecutiveAccessLevel!
  drilldownAllowed: Boolean!
  definitionVersion: String!
  definitions: [OverviewDefinition!]!
  disclosure: DisclosureRule!
  rankBy: ExecutiveRankBy!
  kpis: ExecutiveKpis!
  freshness: ExecutiveFreshness!
  months: [ExecutiveMonth!]!
  regions: [ExecutiveUnit!]!
  territories: [ExecutiveUnit!]!
  engagement: ExecutiveEngagement!
  notes: [Disclosure!]!
}

type ExecutiveRecord {
  recordId: ID!
  kind: String!
  territoryId: ID!
  hcpId: ID
  hcpName: String
  "The channel of a call, or the catalog question id of a response."
  detail: String
  responseText: String
  interactionDate: AWSDate
  loadedAt: AWSDateTime
}

"Supporting records behind one chart point. Only for an Executive with explicit record-level permission."
type ExecutiveDrilldown {
  scopeId: ID!
  kind: ExecutiveDrilldownKind!
  month: AWSDate!
  total: Int!
  truncated: Boolean!
  dataThrough: AWSDateTime
  scopeLabel: String!
  records: [ExecutiveRecord!]!
}

enum FlagKind {
  SUMMARY
  IDENTIFIER
  TERRITORY_ASSIGNMENT
}

enum FlagTargetType {
  SUMMARY
  CALL
  HCP
  TERRITORY
}

enum FlagStatus {
  OPEN
  IN_REVIEW
  RESOLVED
  DISMISSED
}

"A user's report that a summary, an identifier or a territory assignment is wrong, with its review status."
type Flag {
  flagId: ID!
  kind: FlagKind!
  targetType: FlagTargetType!
  targetId: String!
  note: String
  status: FlagStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  scopeLabel: String
  dataThrough: AWSDateTime
}

input FlagInput {
  kind: FlagKind!
  targetType: FlagTargetType!
  targetId: String!
  note: String
}

"""A governed login-to-roster review item. Candidate rows are never auto-linked."""
type IdentityMatch {
  userId: ID!
  displayName: String!
  identityStatus: String!
  rosterSourceRowId: ID
  rosterName: String
  exactEmailCandidateCount: Int!
  candidateRosterSourceRowIds: [ID!]!
  flag: String!
}

type PermissionGrant { permissionCode: String!, description: String! }
type RolePermissionMatrix { roleId: ID!, roleName: String!, permissions: [PermissionGrant!]! }
type ScopeAssignment {
  assignmentId: ID!
  userId: ID!
  displayName: String!
  territoryId: String!
  assignmentType: String!
  effectiveFrom: AWSDateTime!
  effectiveTo: AWSDateTime
  unresolvedTerritory: Boolean!
}
type AccessAuditEvent {
  eventId: ID!
  actorUserId: ID
  action: String!
  resourceType: String!
  resourceId: String
  outcome: String!
  occurredAt: AWSDateTime!
}
type AdminAccessOverview {
  identityMatches: [IdentityMatch!]!
  availablePermissions: [PermissionGrant!]!
  roleMatrix: [RolePermissionMatrix!]!
  scopeAssignments: [ScopeAssignment!]!
}
input AccessAuditFilter { actorUserId: ID, action: String, resourceType: String, outcome: String, from: AWSDateTime, to: AWSDateTime }
input ScopeAssignmentInput { userId: ID!, territoryId: String!, assignmentType: String!, effectiveFrom: AWSDateTime!, effectiveTo: AWSDateTime }
input RolePermissionInput { roleId: ID!, permissionCodes: [String!]! }
input IdentityMappingInput { userId: ID!, rosterSourceRowId: ID! }
type ChatRun { runId: ID!, status: String! }
type ChatEvent { seq: Int!, data: String! }
type ChatEventPage { events: [ChatEvent!]!, done: Boolean!, status: String! }
input ChatMessageInput { role: String!, content: String! }
type SourceField { label: String!, value: String! }
type SourceRecord { dataset: String!, recordId: ID!, title: String!, fields: [SourceField!]!, dataThrough: AWSDateTime }

"""What one row of a "Show rows" table is: a call, an HCP or a recorded response."""
enum ChatRowKind { CALLS HCPS RESPONSES }
enum ChatRowColumnType { TEXT DATE NUMBER }
enum ChatRowSortDir { ASC DESC }
type ChatRowColumn { key: String!, label: String!, type: ChatRowColumnType! }
type ChatRow { id: ID!, cells: [String]! }
"""
One sorted page of the exact rows behind a figure in a chat answer, limited by the caller's row-level security.
`total` is counted now from the rows; `answerCount` is the figure the answer stated, so a difference means the data
changed since the answer was given.
"""
type ChatRowsPage {
  rowSetId: ID!
  kind: ChatRowKind!
  label: String!
  scope: String!
  period: String!
  "What one row is."
  definition: String!
  total: Int!
  answerCount: Int!
  columns: [ChatRowColumn!]!
  rows: [ChatRow!]!
  offset: Int!
  limit: Int!
  sortBy: String!
  sortDir: ChatRowSortDir!
  "True when the caller holds the chat row export permission."
  canExport: Boolean!
  dataThrough: AWSDateTime
}
"""A CSV of the rows behind a figure, created only after access and the export permission were re-checked and the export was audited."""
type ChatRowsExport { rowSetId: ID!, fileName: String!, mimeType: String!, content: String!, rowCount: Int!, total: Int!, truncated: Boolean!, exportedAt: AWSDateTime! }

"One BE-published event for the AWS AppSync subscription path."
type LiveChatEvent { runId: ID!, seq: Int!, data: String! }
input PublishChatEventInput { runId: ID!, seq: Int!, data: String! }

enum HcpFieldState { PRESENT MISSING }
type HcpField { value: String state: HcpFieldState! }
type HcpSearchResult { hcpId: ID! name: HcpField! institution: HcpField! territory: HcpField! }
type HcpProfile { hcpId: ID! name: HcpField! specialty: HcpField! discipline: HcpField! type: HcpField! institution: HcpField! credentials: HcpField! territory: HcpField! }
type HcpCallInteraction { callId: ID! interactionDate: AWSDate! channels: [String!]! types: [String!]! statuses: [String!]! products: [String!]! topics: [String!]! sourceRecordId: ID! }
type HcpResponse { responseId: ID! interactionId: ID! parentResponseId: ID questionId: String! question: String! answer: String! interactionDate: AWSDate! sourceRecordId: ID! }
type HcpPerspective { questionId: String! question: String! answers: [HcpResponse!]! }
type HcpTimeline { hcpId: ID! interactions: [HcpCallInteraction!]! responses: [HcpResponse!]! perspectives: [HcpPerspective!]! }
"""One shared filter state. Empty fields mean "all values I am authorized to see"."""
input InsightFiltersInput {
  from: AWSDate
  to: AWSDate
  territoryId: String
  molecule: String
  landscape: String
  study: String
  survey: String
  questionId: String
}

type FilterOption {
  value: String!
  label: String!
}

type FilterOptions {
  territories: [FilterOption!]!
  molecules: [FilterOption!]!
  landscapes: [FilterOption!]!
  studies: [FilterOption!]!
  surveys: [FilterOption!]!
  questions: [FilterOption!]!
}

"""A response category is always scoped to exactly one question and denominator."""
type ResponseDistribution {
  questionId: ID!
  questionText: String!
  parentQuestionId: ID
  response: String!
  count: Int!
  denominator: Int!
  percentage: Float!
}

type CatalogQuestion {
  questionId: ID!
  questionText: String!
  topic: String
  molecule: String
  tumorType: String
  study: String
  survey: String
  status: String!
  effectiveFrom: AWSDateTime
  effectiveTo: AWSDateTime
  applicability: String!
}

type InsightDiscovery {
  scopeLabel: String!
  options: FilterOptions!
  distributions: [ResponseDistribution!]!
  questions: [CatalogQuestion!]!
  themes: [QualitativeTheme!]!
  followUpTopics: [FollowUpTopic!]!
}
"A derived grouping of recorded responses; it is never a source fact."
type QualitativeTheme { name: String!, responseCount: Int!, excerpt: String!, recordId: ID!, questionText: String }
"A possible discussion topic supported by source evidence, not a confirmed commitment."
type FollowUpTopic { topic: String!, evidenceCount: Int!, excerpt: String!, recordId: ID! }
type SemanticInsightResult { responseId: ID!, questionText: String!, responseText: String!, interactionDate: AWSDate!, territoryId: String!, score: Float! }

type SavedView {
  savedViewId: ID!
  name: String!
  reportKind: String!
  filters: InsightFilters!
  createdAt: AWSDateTime!
}

"""
The person's saved look. Values are validated by the BE: style auto|warm|clinical, mode device|light|charcoal|black,
density auto|comfortable|compact. "auto" means the persona (style) or device (density) default.
"""
type AppearancePreference {
  style: String!
  mode: String!
  density: String!
  updatedAt: AWSDateTime!
}

input AppearanceInput {
  style: String!
  mode: String!
  density: String!
}

"""An editable, optional post-call draft. Its lines are copied verbatim from entered notes."""
type PostCallDraft {
  draftId: ID!
  notes: String!
  structuredLines: [String!]!
  status: String!
  createdAt: AWSDateTime!
}

"""A confirmed follow-up commitment. Suggestions never create one of these by themselves."""
type FollowUpTask {
  taskId: ID!
  description: String!
  ownerUserId: ID!
  dueDate: AWSDate
  status: String!
  sourceDraftId: ID
  createdAt: AWSDateTime!
}

input PostCallDraftInput { notes: String! }
input ConfirmFollowUpTaskInput { description: String!, dueDate: AWSDate, sourceDraftId: ID }

"""A deterministic, user-owned rule over in-scope recorded responses."""
type TopicAlertRule {
  ruleId: ID!
  topic: String!
  threshold: Int!
  periodDays: Int!
  createdAt: AWSDateTime!
}

"""An alert is present only when its deterministic count meets its saved threshold."""
type TopicAlert {
  ruleId: ID!
  topic: String!
  threshold: Int!
  periodDays: Int!
  count: Int!
  evidenceResponseIds: [ID!]!
}

input TopicAlertRuleInput { topic: String!, threshold: Int!, periodDays: Int! }

type InsightFilters {
  from: AWSDate
  to: AWSDate
  territoryId: String
  molecule: String
  landscape: String
  study: String
  survey: String
  questionId: String
}

input SaveViewInput {
  name: String!
  reportKind: String!
  filters: InsightFiltersInput!
}

enum HierarchySeverity { ERROR WARNING }

"""One holder of a territory: directly assigned, or inherited from `viaTerritoryId` further up."""
type HierarchyHolder { userId: ID!, displayName: String!, assignmentType: String!, viaTerritoryId: ID! }

"""A territory or region in the hierarchy graph. One node may have several parents."""
type HierarchyNode {
  territoryId: ID!
  name: String!
  kind: String!
  parentIds: [ID!]!
  childIds: [ID!]!
  "Distance from the nearest root; null when no root reaches it (a cycle, or no links at all)."
  depth: Int
  directHolders: [HierarchyHolder!]!
  inheritedHolders: [HierarchyHolder!]!
  findingCodes: [String!]!
}

"""`source` is scope_relationship, source_feed, or both."""
type HierarchyEdge { childId: ID!, parentId: ID!, source: String!, effectiveFrom: AWSDateTime }

"""
code is CYCLE, ORPHAN_TERRITORY, MISSING_LINK, OVERLAP or UNCOVERED_TERRITORY.
Messages name territories and counts only.
"""
type HierarchyFinding { code: String!, severity: HierarchySeverity!, territoryIds: [ID!]!, message: String! }

type HierarchyValidation {
  generatedAt: AWSDateTime!
  nodes: [HierarchyNode!]!
  edges: [HierarchyEdge!]!
  findings: [HierarchyFinding!]!
  errorCount: Int!
  warningCount: Int!
}

enum AssignmentStatus { SCHEDULED ACTIVE EXPIRED }

"""One effective-dated scope assignment. `status` is computed from the clock, not stored."""
type AccessTimelineEntry {
  assignmentId: ID!
  userId: ID!
  displayName: String!
  territoryId: String!
  assignmentType: String!
  effectiveFrom: AWSDateTime!
  effectiveTo: AWSDateTime
  approvedBy: ID
  "The request that produced this assignment; null for assignments made directly."
  requestId: ID
  status: AssignmentStatus!
  secondsRemaining: Int
  unresolvedTerritory: Boolean!
}

enum ScopeChangeKind { TRANSFER TEMPORARY_COVERAGE }
enum ScopeChangeStatus { PENDING APPROVED REJECTED }
enum ScopeChangeDecision { APPROVE REJECT }

"""A transfer or temporary coverage, with who asked, who decided and why."""
type ScopeChangeRequest {
  requestId: ID!
  kind: ScopeChangeKind!
  userId: ID!
  displayName: String!
  fromTerritoryId: String
  toTerritoryId: String!
  effectiveFrom: AWSDateTime!
  effectiveTo: AWSDateTime
  reason: String!
  status: ScopeChangeStatus!
  requestedBy: ID!
  requestedAt: AWSDateTime!
  decidedBy: ID
  decidedAt: AWSDateTime
  decisionNote: String
}

"""kind is SAME_USER_DUPLICATE or SHARED_PRIMARY."""
type AccessOverlap { kind: String!, userId: ID, territoryId: String!, assignmentIds: [ID!]!, message: String! }

type AccessTimeline {
  generatedAt: AWSDateTime!
  entries: [AccessTimelineEntry!]!
  requests: [ScopeChangeRequest!]!
  overlaps: [AccessOverlap!]!
}

input ScopeChangeInput {
  kind: ScopeChangeKind!
  userId: ID!
  "Required for a transfer: the territory the user leaves."
  fromTerritoryId: String
  toTerritoryId: String!
  effectiveFrom: AWSDateTime!
  "Required for temporary coverage (it expires then); not allowed for a transfer."
  effectiveTo: AWSDateTime
  reason: String!
}
input ScopeChangeDecisionInput { requestId: ID!, decision: ScopeChangeDecision!, note: String }

enum ResponseAccessLevel { NONE AGGREGATE_ONLY RECORDS }
"""Whether a role can see catalog questions (catalog.read). Says nothing about responses."""
type CatalogVisibilityRow { roleId: ID!, roleName: String!, catalogVisible: Boolean! }
"""How much of the HCP responses a role can see. Says nothing about the catalog."""
type ResponseAccessRow { roleId: ID!, roleName: String!, level: ResponseAccessLevel! }
type AdminVisibility { catalogMatrix: [CatalogVisibilityRow!]!, responseMatrix: [ResponseAccessRow!]! }
input CatalogVisibilityInput { roleId: ID!, visible: Boolean! }
input ResponseAccessInput { roleId: ID!, level: ResponseAccessLevel! }

type CatalogQuestionRow { questionId: ID!, text: String, status: String, molecule: String, tumorType: String, study: String, survey: String }
type QuestionResponse { responseId: ID!, territoryId: String, interactionDate: AWSDate, text: String }
type QuestionResponses { questionId: ID!, total: Int!, responses: [QuestionResponse!]! }
type IngestionRun { runId: ID! sourceId: ID! sourceName: String! status: String! startedAt: AWSDateTime! completedAt: AWSDateTime recordsLoaded: Int! errorSummary: String }
type QualityRecord { recordId: ID! sourceTable: String! sourceRecordId: String! label: String! }
type DataQualityIssue { issueId: ID! category: String! severity: String! title: String! summary: String! affectedCount: Int! records: [QualityRecord!]! }
type QuestionDependencyNode { questionId: ID! parentQuestionId: String state: String! }
type QuestionDependencyGraph { missingParentCount: Int! duplicateKeyCount: Int! cycleCount: Int! nodes: [QuestionDependencyNode!]! }
type IdentityQuality { matched: Int! unmatched: Int! }
type RecordGrainQuality { callProductRows: Int! distinctCalls: Int! }
type AdminDataQuality { ingestionRuns: [IngestionRun!]! identities: IdentityQuality! duplicateKeyCount: Int! recordGrain: RecordGrainQuality! issues: [DataQualityIssue!]! questionGraph: QuestionDependencyGraph! }
"""One assertion from the local API-as-persona authorization verification suite."""
