# Shared GraphQL contract (foundation-contract.md). Used verbatim by the Amplify
# Gen2 backend (real AWS) and by the local floci provisioner.
# The default auth mode is the Cognito user pool, so no per-type auth directives.
type LandingKpis {
  distinctCalls: Int!
  distinctEngagedHcps: Int!
  responseCount: Int!
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
}

type Me {
  userId: ID!
  fullName: String!
  email: String!
  persona: String!
  scopeLabel: String!
}

"""
One territory on the real-world map. Only territories in the caller's effective scope are
returned: out-of-scope territory metadata is itself access-controlled, so it is never named or
coloured. `distinctCalls` is null (and `suppressed` true) when an aggregate-only caller would
otherwise see a small group.
"""
type GeoTerritory {
  territoryId: ID!
  name: String!
  regionId: String!
  regionName: String!
  "ISO 3166-1 alpha-2."
  countryCode: String!
  countryName: String!
  "USPS code for the United States, the local code elsewhere (the call feed's st_cd)."
  subdivisionCode: String!
  subdivisionName: String!
  latitude: Float!
  longitude: Float!
  isOwn: Boolean!
  distinctCalls: Int
  suppressed: Boolean!
}

"Distinct calls across a country's in-scope territories (not a sum of per-territory counts)."
type GeoCountry {
  countryCode: ID!
  countryName: String!
  territoryCount: Int!
  distinctCalls: Int
  suppressed: Boolean!
}

"Counts for the territory map, with the window they cover."
type GeoActivity {
  from: AWSDate!
  to: AWSDate!
  dataThrough: AWSDateTime
  scopeLabel: String!
  territories: [GeoTerritory!]!
  countries: [GeoCountry!]!
}

"""
One calendar month of the caller's activity. Counts only: no target, rank or score.
distinctEngagedHcps is distinct within the month, so months do not add up to the window total.
isPartial marks a month that data-through has not yet covered in full.
"""
type ActivityMonth {
  month: AWSDate!
  distinctCalls: Int!
  distinctEngagedHcps: Int!
  isPartial: Boolean!
  channels: [ChannelCount!]!
}

"Distinct calls recorded under one channel. A call under several channels counts once in each."
type ChannelCount {
  channel: String!
  distinctCalls: Int!
}

type ActivityTrends {
  from: AWSDate!
  to: AWSDate!
  months: [ActivityMonth!]!
  channels: [String!]!
  totalDistinctCalls: Int!
  totalDistinctEngagedHcps: Int!
  dataThrough: AWSDateTime
  scopeLabel: String!
}

enum ActivityMetric {
  CALLS
  HCPS
}

"""
A record behind a chart point. interactionDate is when the exchange happened; loadedAt is
when the record reached this system. They are different things and both are shown.
"""
type EvidenceRecord {
  recordId: ID!
  kind: String!
  hcpId: String
  hcpName: String
  territoryId: String
  channel: String
  callCount: Int!
  interactionDate: AWSDate!
  loadedAt: AWSDateTime
}

type ActivityEvidence {
  metric: ActivityMetric!
  month: AWSDate!
  channel: String
  total: Int!
  truncated: Boolean!
  latestInteractionDate: AWSDate
  latestLoadedAt: AWSDateTime
  dataThrough: AWSDateTime
  scopeLabel: String!
  records: [EvidenceRecord!]!
}

enum FlagKind {
  SUMMARY
  IDENTIFIER
  TERRITORY_ASSIGNMENT
}

enum FlagTargetType {
  SUMMARY
  CALL
  HCP
  TERRITORY
}

enum FlagStatus {
  OPEN
  IN_REVIEW
  RESOLVED
  DISMISSED
}

"A user's report that a summary, an identifier or a territory assignment is wrong, with its review status."
type Flag {
  flagId: ID!
  kind: FlagKind!
  targetType: FlagTargetType!
  targetId: String!
  note: String
  status: FlagStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  scopeLabel: String
  dataThrough: AWSDateTime
}

input FlagInput {
  kind: FlagKind!
  targetType: FlagTargetType!
  targetId: String!
  note: String
}

"""A governed login-to-roster review item. Candidate rows are never auto-linked."""
type IdentityMatch {
  userId: ID!
  displayName: String!
  identityStatus: String!
  rosterSourceRowId: ID
  rosterName: String
  exactEmailCandidateCount: Int!
  candidateRosterSourceRowIds: [ID!]!
  flag: String!
}

type PermissionGrant { permissionCode: String!, description: String! }
type RolePermissionMatrix { roleId: ID!, roleName: String!, permissions: [PermissionGrant!]! }
type ScopeAssignment {
  assignmentId: ID!
  userId: ID!
  displayName: String!
  territoryId: String!
  assignmentType: String!
  effectiveFrom: AWSDateTime!
  effectiveTo: AWSDateTime
  unresolvedTerritory: Boolean!
}
type AccessAuditEvent {
  eventId: ID!
  actorUserId: ID
  action: String!
  resourceType: String!
  resourceId: String
  outcome: String!
  occurredAt: AWSDateTime!
}
type AdminAccessOverview {
  identityMatches: [IdentityMatch!]!
  availablePermissions: [PermissionGrant!]!
  roleMatrix: [RolePermissionMatrix!]!
  scopeAssignments: [ScopeAssignment!]!
}
input AccessAuditFilter { actorUserId: ID, action: String, resourceType: String, outcome: String, from: AWSDateTime, to: AWSDateTime }
input ScopeAssignmentInput { userId: ID!, territoryId: String!, assignmentType: String!, effectiveFrom: AWSDateTime!, effectiveTo: AWSDateTime }
input RolePermissionInput { roleId: ID!, permissionCodes: [String!]! }
input IdentityMappingInput { userId: ID!, rosterSourceRowId: ID! }
type ChatRun { runId: ID!, status: String! }
type ChatEvent { seq: Int!, data: String! }
type ChatEventPage { events: [ChatEvent!]!, done: Boolean!, status: String! }
input ChatMessageInput { role: String!, content: String! }
type SourceField { label: String!, value: String! }
type SourceRecord { dataset: String!, recordId: ID!, title: String!, fields: [SourceField!]!, dataThrough: AWSDateTime }

enum HcpFieldState { PRESENT MISSING }
type HcpField { value: String state: HcpFieldState! }
type HcpSearchResult { hcpId: ID! name: HcpField! institution: HcpField! territory: HcpField! }
type HcpProfile { hcpId: ID! name: HcpField! specialty: HcpField! discipline: HcpField! type: HcpField! institution: HcpField! credentials: HcpField! territory: HcpField! }

type Query {
  me: Me!
  landingKpis(from: AWSDate, to: AWSDate): LandingKpis!
  geoActivity(from: AWSDate, to: AWSDate): GeoActivity!
  "Monthly distinct calls, distinct engaged HCPs and channel mix for the last `months` months (default 12)."
  activityTrends(months: Int): ActivityTrends!
  "The distinct calls or HCPs behind one chart point (a month, optionally one channel)."
  activityEvidence(metric: ActivityMetric!, month: AWSDate!, channel: String, limit: Int): ActivityEvidence!
  "The caller's own flags, newest first."
  myFlags: [Flag!]!
  adminAccessOverview: AdminAccessOverview!
  accessAudit(filter: AccessAuditFilter): [AccessAuditEvent!]!
  chatEvents(runId: ID!, after: Int): ChatEventPage!
  chatCitation(dataset: String!, recordId: ID!): SourceRecord!
  searchHcps(query: String!, limit: Int): [HcpSearchResult!]!
  hcpProfile(hcpId: ID!): HcpProfile!
}

type Mutation {
  "Raise a flag. Raising the same open flag again returns the existing one."
  flagIssue(input: FlagInput!): Flag!
  approveIdentityMapping(input: IdentityMappingInput!): IdentityMatch!
  setRolePermissions(input: RolePermissionInput!): RolePermissionMatrix!
  createScopeAssignment(input: ScopeAssignmentInput!): ScopeAssignment!
  startChatRun(threadId: ID!, runId: ID!, message: String!, history: [ChatMessageInput!]): ChatRun!
}
