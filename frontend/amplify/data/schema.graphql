# --- Executive themes, cross-region topics and leadership summaries (ticket 13, #14) -----------------
# Aggregate-only for an Executive: every count is a SuppressedCount (counts of 1 to 4 are withheld, with
# complementary suppression), themes are derived keyword groupings of free text, and every figure comes
# from SQL under the explicit executive scope. Citations are AGGREGATE (the cited set of responses,
# described by its filters and size) unless the Executive also holds record-level permission, in which
# case they are RECORD citations (response ids with excerpts). Nothing here claims a cause.

enum ExecutiveThemeFacet { PORTFOLIO MOLECULE DISEASE_AREA STUDY }
"""RISING and FALLING come from the approved threshold rule. WITHHELD means a count behind the arrow is a small group."""
enum ExecutiveTrend { RISING FALLING STEADY WITHHELD INSUFFICIENT_SAMPLE }
enum ExecutiveCitationKind { AGGREGATE RECORD }
enum LeadershipStaleReason { NEWER_DATA_LOADED SCOPE_CHANGED }

"""The responses a figure rests on. AGGREGATE describes the set (filters and size); RECORD names one response."""
type ExecutiveCitation {
  citationId: ID!
  kind: ExecutiveCitationKind!
  dataset: String!
  label: String!
  "AGGREGATE: how many responses the cited set holds (SuppressedCount; null value when withheld)."
  responses: SuppressedCount
  recordId: ID
  excerpt: String
  interactionDate: AWSDate
}

type ExecutiveThemeCard {
  cardId: ID!
  facetValue: String!
  topic: String!
  "Free-text responses on this theme in the window."
  responses: SuppressedCount!
  priorResponses: SuppressedCount!
  distinctHcps: SuppressedCount!
  "Percent of the group's free-text responses; null when withheld."
  share: Float
  regionCount: Int!
  trend: ExecutiveTrend!
  citations: [ExecutiveCitation!]!
}

